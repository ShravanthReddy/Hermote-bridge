# GoReleaser config for hermes-remote (published from the public mirror repo).
# Release: tag `vX.Y.Z` on the mirror, then `goreleaser release --clean`.
# Signing/notarization (Developer ID) is added once the certificate exists;
# curl-installed and brew-installed binaries carry no quarantine flag, so
# unsigned builds run today.
version: 2

project_name: hermes-remote

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: hermes-remote
    main: ./cmd/hermes-remote
    binary: hermes-remote
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [arm64, amd64]
  - id: hermes-relay
    main: ./cmd/hermes-relay
    binary: hermes-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [arm64, amd64]

universal_binaries:
  - id: hermes-remote-universal
    ids: [hermes-remote]
    replace: true
    name_template: hermes-remote

archives:
  - id: default
    ids: [hermes-remote-universal, hermes-remote]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files: [LICENSE, README.md]
  - id: relay
    ids: [hermes-relay]
    formats: [tar.gz]
    name_template: >-
      hermes-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files: [LICENSE, deploy/relay/install-vm.sh]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: false
  prerelease: auto
  footer: |
    Install or update:

        curl -fsSL https://raw.githubusercontent.com/{{ .Env.GITHUB_OWNER }}/hermes-remote/main/install.sh | bash

brews:
  - name: hermes-remote
    ids: [default] # the CLI archives only; relay archives are Linux-only server builds
    repository:
      owner: "{{ .Env.GITHUB_OWNER }}"
      name: homebrew-hermes
    homepage: https://github.com/{{ .Env.GITHUB_OWNER }}/hermes-remote
    description: Pair the Hermes iPhone app with the Mac that runs Hermes
    license: MIT
    install: |
      bin.install "hermes-remote"
    caveats: |
      Start the bridge and show the pairing QR code:
        hermes-remote up
    test: |
      system "#{bin}/hermes-remote", "version"
