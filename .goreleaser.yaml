# GoReleaser config for hermote-bridge (published from the public mirror repo).
# Release: tag `vX.Y.Z` on the mirror, then `goreleaser release --clean`.
# Signing/notarization (Developer ID) is added once the certificate exists;
# curl-installed and brew-installed binaries carry no quarantine flag, so
# unsigned builds run today.
version: 2

project_name: hermote-bridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: hermote-bridge
    main: ./cmd/hermote-bridge
    binary: hermote-bridge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [arm64, amd64]
  - id: hermes-relay
    main: ./cmd/hermes-relay
    binary: hermes-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [arm64, amd64]

universal_binaries:
  - id: hermote-bridge-universal
    ids: [hermote-bridge]
    replace: true
    name_template: hermote-bridge

archives:
  - id: default
    ids: [hermote-bridge-universal, hermote-bridge]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files: [LICENSE, README.md]
  - id: relay
    ids: [hermes-relay]
    formats: [tar.gz]
    name_template: >-
      hermes-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files: [LICENSE, deploy/relay/install-vm.sh]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: false
  prerelease: auto
  footer: |
    Install or update:

        curl -fsSL https://raw.githubusercontent.com/{{ .Env.GITHUB_OWNER }}/Hermote-bridge/main/install.sh | bash

# Homebrew publication is intentionally separate. The one-time formula rename
# also deletes the old formula and writes formula_renames.json, which GoReleaser
# cannot publish as one reviewed tap migration commit.
